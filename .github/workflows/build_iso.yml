name: Build ISOs

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: [self-hosted, linux, x64]

    container:
      image: ubuntu:24.04
      options: >-
        --privileged
        --cgroupns=host
        -v /sys/fs/cgroup:/sys/fs/cgroup:rw
      volumes:
        - /dev:/dev

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        image_name:
          - bazzite-asus-dx-nvidia-open
          - bazzite-asus-dx
        major_version: [42]

    steps:
      - name: Prepare tooling inside job container
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq xorriso squashfs-tools \
            make sudo gzip tar coreutils \
            podman uidmap fuse-overlayfs  # <-- add these

      # OPTIONAL: comment out on self-hosted to avoid no-op warnings
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set Image Tag
        id: generate-tag
        run: |
          TAG="stable"
          if [[ "${{ github.ref_name }}" == "testing" ]]; then
            TAG="testing"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set Flatpaks Directory Shortname
        id: generate-flatpak-dir-shortname
        run: |
          FLATPAK_DIR_SHORTNAME="installer/kde_flatpaks"
          if [[ "${{ matrix.image_name }}" =~ "gnome" ]]; then
            FLATPAK_DIR_SHORTNAME="installer/gnome_flatpaks"
          fi
          echo "flatpak-dir-shortname=$(realpath ${FLATPAK_DIR_SHORTNAME})" >> $GITHUB_OUTPUT

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@d0603cd0a7dd490be678164909f65c7737470a7f # v6
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Obtain non-deck image ref
        id: get-nondeck-ref
        run: |
          ref="${{ matrix.image_name }}"
          ref="${ref/-deck/}"
          echo "ref=${ref}" >> $GITHUB_OUTPUT

      - name: Build ISOs
        uses: ublue-os/titanoboa@main
        id: build
        with:
          image-ref: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.get-nondeck-ref.outputs.ref }}:${{ steps.generate-tag.outputs.tag }}
          container-image: ${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}:${{ steps.generate-tag.outputs.tag }}
          iso-dest: ${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}.iso
          flatpaks-list: ${{ steps.generate-flatpak-dir-shortname.outputs.flatpak-dir-shortname }}/flatpaks
          hook-pre-initramfs: ${{ github.workspace }}/installer/titanoboa_hook_preinitramfs.sh
          hook-post-rootfs: ${{ github.workspace }}/installer/titanoboa_hook_postrootfs.sh
          add-polkit: "true"

      - name: Move ISOs to Upload Directory
        id: upload-directory
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          DEST=${ISO_UPLOAD_DIR}/$(basename ${{ steps.build.outputs.iso-dest }})
          mkdir -p "${ISO_UPLOAD_DIR}"
          mv "${{ steps.build.outputs.iso-dest }}" "${DEST}"
          sha256sum "${DEST}" > "${DEST}-CHECKSUM"
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT

      - name: Upload ISOs and Checksum to Job Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}
          path: ${{ steps.upload-directory.outputs.iso-upload-dir }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true
